<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Explorer | Nexph</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style type="text/tailwindcss">
@custom-variant dark (&:where(.dark, .dark *));
@theme { --font-inter: "Inter", sans-serif; }
body { font-family: "Inter", sans-serif; }
</style>
<script>
if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
document.documentElement.classList.add('dark');
}
</script>
</head>
<body class="bg-slate-50 dark:bg-[#020617] text-slate-900 dark:text-white min-h-screen selection:bg-indigo-500/30 font-sans">
<div class="max-w-7xl mx-auto p-8 animate-in fade-in slide-in-from-bottom-4 duration-500">
    <div class="mb-10">
        <div class="inline-flex items-center justify-center p-3 bg-indigo-50 dark:bg-indigo-500/10 rounded-2xl mb-4 border border-indigo-500/20">
            <i data-lucide="network" class="w-8 h-8 text-indigo-600 dark:text-indigo-400"></i>
        </div>
        <h1 class="text-4xl font-extrabold tracking-tight mb-3">API Explorer</h1>
        <p class="text-slate-500 text-lg">Test and explore your generated REST APIs in real-time.</p>
    </div>
    <div id="api-list" class="space-y-8"></div>
</div>
<script>
lucide.createIcons();
async function loadAPIs() {
    try {
        const res = await fetch('/api');
        let tables = [];
        if (res.ok) {
            const policy = await res.json();
            tables = Object.keys(policy.tables || {});
        }
        const renderTables = tables.length > 0 ? tables : ['users', 'job_workers'];
        
        const container = document.getElementById('api-list');
        renderTables.forEach(table => {
            const card = document.createElement('div');
            card.className = 'bg-white dark:bg-slate-900/80 backdrop-blur-xl border border-slate-200/60 dark:border-slate-800/60 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-all group';
            card.innerHTML = `
                <div class="px-6 py-5 bg-slate-50/80 dark:bg-slate-800/40 border-b border-slate-200/60 dark:border-slate-800/60 flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div class="flex items-center gap-3">
                        <i data-lucide="database" class="w-5 h-5 text-indigo-500"></i>
                        <h3 class="text-xl font-bold capitalize text-slate-900 dark:text-white">\${table}</h3>
                    </div>
                    <div class="px-3 py-1.5 bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-800 text-xs font-mono text-slate-500 shadow-sm">
                        /api/\${table}
                    </div>
                </div>
                <div class="divide-y divide-slate-100 dark:divide-slate-800/50 p-6 space-y-4">
                    <div class="flex flex-col md:flex-row md:items-center gap-4 p-4 rounded-xl hover:bg-slate-50/50 dark:hover:bg-slate-800/30 transition-colors border border-transparent hover:border-slate-200 dark:hover:border-slate-700">
                        <span class="px-3 py-1.5 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 text-xs font-bold rounded-lg border border-emerald-500/20 min-w-[70px] text-center shadow-sm">GET</span>
                        <code class="text-sm font-mono flex-1 text-slate-700 dark:text-slate-300">/api/\${table}</code>
                        <button onclick="testAPI('GET', '/api/\${table}', '\${table}')" class="w-full md:w-auto px-3 py-1.5 bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-xs font-bold rounded-lg hover:opacity-90 transition-opacity shadow-sm flex items-center justify-center gap-2"><i data-lucide="play" class="w-3.5 h-3.5"></i> Send Request</button>
                    </div>
                    <div class="flex flex-col md:flex-row md:items-center gap-4 p-4 rounded-xl hover:bg-slate-50/50 dark:hover:bg-slate-800/30 transition-colors border border-transparent hover:border-slate-200 dark:hover:border-slate-700">
                        <span class="px-3 py-1.5 bg-sky-500/10 text-sky-600 dark:text-sky-400 text-xs font-bold rounded-lg border border-sky-500/20 min-w-[70px] text-center shadow-sm">POST</span>
                        <code class="text-sm font-mono flex-1 text-slate-700 dark:text-slate-300">/api/\${table}</code>
                        <button onclick="testAPI('POST', '/api/\${table}', '\${table}')" class="w-full md:w-auto px-3 py-1.5 bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-xs font-bold rounded-lg hover:opacity-90 transition-opacity shadow-sm flex items-center justify-center gap-2"><i data-lucide="play" class="w-3.5 h-3.5"></i> Send Request</button>
                    </div>
                    <div class="flex flex-col md:flex-row md:items-center gap-4 p-4 rounded-xl hover:bg-slate-50/50 dark:hover:bg-slate-800/30 transition-colors border border-transparent hover:border-slate-200 dark:hover:border-slate-700">
                        <span class="px-3 py-1.5 bg-amber-500/10 text-amber-600 dark:text-amber-400 text-xs font-bold rounded-lg border border-amber-500/20 min-w-[70px] text-center shadow-sm">PUT</span>
                        <code class="text-sm font-mono flex-1 text-slate-700 dark:text-slate-300">/api/\${table}/{id}</code>
                        <button onclick="testAPI('PUT', '/api/\${table}/1', '\${table}')" class="w-full md:w-auto px-3 py-1.5 bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-xs font-bold rounded-lg hover:opacity-90 transition-opacity shadow-sm flex items-center justify-center gap-2"><i data-lucide="play" class="w-3.5 h-3.5"></i> Send Request</button>
                    </div>
                    <div class="flex flex-col md:flex-row md:items-center gap-4 p-4 rounded-xl hover:bg-slate-50/50 dark:hover:bg-slate-800/30 transition-colors border border-transparent hover:border-slate-200 dark:hover:border-slate-700">
                        <span class="px-3 py-1.5 bg-rose-500/10 text-rose-600 dark:text-rose-400 text-xs font-bold rounded-lg border border-rose-500/20 min-w-[70px] text-center shadow-sm">DELETE</span>
                        <code class="text-sm font-mono flex-1 text-slate-700 dark:text-slate-300">/api/\${table}/{id}</code>
                        <button onclick="testAPI('DELETE', '/api/\${table}/1', '\${table}')" class="w-full md:w-auto px-3 py-1.5 bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-xs font-bold rounded-lg hover:opacity-90 transition-opacity shadow-sm flex items-center justify-center gap-2"><i data-lucide="play" class="w-3.5 h-3.5"></i> Send Request</button>
                    </div>
                    <div id="result-wrapper-\${table}" class="hidden mt-6 rounded-xl border border-slate-800/60 bg-slate-950 overflow-hidden shadow-inner">
                        <div class="px-4 py-3 border-b border-slate-800/60 flex items-center gap-2 bg-slate-900/50">
                            <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider flex-1">Response Payload</span>
                        </div>
                        <pre id="result-\${table}" class="p-5 text-emerald-400 text-sm font-mono overflow-auto max-h-96 whitespace-pre-wrap leading-relaxed"></pre>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
        lucide.createIcons();
    } catch(e) {
        console.error(e);
    }
}
async function testAPI(method, url, table) {
    const wrapper = document.getElementById(`result-wrapper-\${table}`);
    const resultDiv = document.getElementById(`result-\${table}`);
    wrapper.classList.remove('hidden');
    resultDiv.textContent = 'Connecting...';
    resultDiv.className = 'p-5 text-emerald-400 text-sm font-mono overflow-auto max-h-96 whitespace-pre-wrap leading-relaxed';
    try {
        const res = await fetch(url, { method });
        const ct = res.headers.get('content-type');
        const data = ct && ct.includes('json') ? await res.json() : await res.text();
        if (!res.ok) {
            resultDiv.className = 'p-5 text-rose-400 text-sm font-mono overflow-auto max-h-96 whitespace-pre-wrap leading-relaxed';
        }
        resultDiv.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    } catch (e) {
        resultDiv.className = 'p-5 text-rose-400 text-sm font-mono overflow-auto max-h-96 whitespace-pre-wrap leading-relaxed';
        resultDiv.textContent = 'Network Error: ' + e.message;
    }
}
loadAPIs();
</script>
</body>
</html>
