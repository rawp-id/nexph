<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Health Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 2rem;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        h1 { font-size: 1.8rem; font-weight: 600; }
        .status-badge {
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
        }
        .status-ok { background: #00c853; color: #fff; }
        .status-error { background: #ff5252; color: #fff; }
        .timestamp { color: #8892b0; font-size: 0.9rem; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        .card-title {
            font-size: 0.85rem;
            color: #8892b0;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }
        .card-value {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .card-sub { color: #8892b0; font-size: 0.85rem; margin-top: 0.5rem; }
        .memory-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
        }
        .memory-section h2 {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            color: #ccd6f6;
        }
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }
        .memory-item { text-align: center; padding: 1rem; }
        .memory-label { color: #8892b0; font-size: 0.85rem; margin-bottom: 0.5rem; }
        .memory-value { font-size: 1.5rem; font-weight: 600; color: #64ffda; }
        .trend-stable { color: #64ffda; }
        .trend-up { color: #ff5252; }
        .trend-down { color: #00c853; }
        .progress-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-top: 1rem;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        .refresh-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .refresh-btn:hover { opacity: 0.9; }
        .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .poll-select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .poll-select option { background: #1a1a2e; color: #fff; }
        .auto-indicator {
            width: 8px; height: 8px;
            background: #64ffda;
            border-radius: 50%;
            display: inline-block;
            margin-right: 0.5rem;
            animation: blink 1s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .error-msg {
            background: rgba(255, 82, 82, 0.2);
            border: 1px solid #ff5252;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .loading { animation: pulse 1.5s infinite; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🖥️ Server Health Dashboard</h1>
                <p class="timestamp" id="timestamp">Loading...</p>
            </div>
            <div style="display: flex; align-items: center; gap: 1rem;">
                <span class="status-badge status-ok" id="status-badge">--</span>
                <select id="poll-interval" class="poll-select">
                    <option value="0">Manual</option>
                    <option value="1000">1s</option>
                    <option value="3000">3s</option>
                    <option value="5000" selected>5s</option>
                    <option value="10000">10s</option>
                    <option value="30000">30s</option>
                </select>
                <button class="refresh-btn" onclick="fetchHealth()">↻ Refresh</button>
            </div>
        </header>

        <div class="error-msg" id="error-msg"></div>

        <div class="grid">
            <div class="card">
                <div class="card-title">Uptime</div>
                <div class="card-value" id="uptime">--</div>
                <div class="card-sub" id="uptime-raw"></div>
            </div>
            <div class="card">
                <div class="card-title">Total Requests</div>
                <div class="card-value" id="total-requests">--</div>
            </div>
            <div class="card">
                <div class="card-title">Total Connections</div>
                <div class="card-value" id="total-connections">--</div>
            </div>
            <div class="card">
                <div class="card-title">Active Connections</div>
                <div class="card-value" id="active-connections">--</div>
            </div>
            <div class="card">
                <div class="card-title">Coroutines</div>
                <div class="card-value" id="coroutines">--</div>
            </div>
        </div>

        <div class="memory-section">
            <h2>💾 Memory Usage</h2>
            <div class="memory-grid">
                <div class="memory-item">
                    <div class="memory-label">Current</div>
                    <div class="memory-value" id="mem-current">--</div>
                </div>
                <div class="memory-item">
                    <div class="memory-label">Peak</div>
                    <div class="memory-value" id="mem-peak">--</div>
                </div>
                <div class="memory-item">
                    <div class="memory-label">Samples</div>
                    <div class="memory-value" id="mem-samples">--</div>
                </div>
                <div class="memory-item">
                    <div class="memory-label">Trend</div>
                    <div class="memory-value" id="mem-trend">--</div>
                </div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="mem-progress" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://0.0.0.0:8080/api/health';

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function formatUptime(seconds) {
            const d = Math.floor(seconds / 86400);
            const h = Math.floor((seconds % 86400) / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (d > 0) return `${d}d ${h}h`;
            if (h > 0) return `${h}h ${m}m`;
            if (m > 0) return `${m}m ${s}s`;
            return `${s}s`;
        }

        function formatNumber(num) {
            return num.toLocaleString();
        }

        function getTrendClass(trend) {
            if (trend === 'stable') return 'trend-stable';
            if (trend === 'increasing') return 'trend-up';
            return 'trend-down';
        }

        function getTrendIcon(trend) {
            if (trend === 'stable') return '→';
            if (trend === 'increasing') return '↑';
            return '↓';
        }

        async function fetchHealth() {
            const btn = document.querySelector('.refresh-btn');
            const errorEl = document.getElementById('error-msg');
            btn.disabled = true;
            btn.textContent = '↻ Loading...';
            errorEl.style.display = 'none';

            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                updateDashboard(data);
            } catch (err) {
                errorEl.textContent = `Failed to fetch: ${err.message}`;
                errorEl.style.display = 'block';
                document.getElementById('status-badge').textContent = 'ERROR';
                document.getElementById('status-badge').className = 'status-badge status-error';
            } finally {
                btn.disabled = false;
                btn.textContent = '↻ Refresh';
            }
        }

        function updateDashboard(data) {
            const badge = document.getElementById('status-badge');
            badge.textContent = data.status.toUpperCase();
            badge.className = `status-badge status-${data.status}`;

            document.getElementById('timestamp').textContent = 
                `Last updated: ${new Date(data.timestamp).toLocaleString()}`;

            const s = data.stats;
            document.getElementById('uptime').textContent = formatUptime(s.uptime);
            document.getElementById('uptime-raw').textContent = `${s.uptime.toFixed(2)} seconds`;
            document.getElementById('total-requests').textContent = formatNumber(s.total_requests);
            document.getElementById('total-connections').textContent = formatNumber(s.total_connections);
            document.getElementById('active-connections').textContent = formatNumber(s.active_connections);
            document.getElementById('coroutines').textContent = formatNumber(s.coroutines);

            const m = s.memory;
            document.getElementById('mem-current').textContent = formatBytes(m.current);
            document.getElementById('mem-peak').textContent = formatBytes(m.peak);
            document.getElementById('mem-samples').textContent = m.samples;

            const trendEl = document.getElementById('mem-trend');
            trendEl.textContent = `${getTrendIcon(m.trend)} ${m.trend}`;
            trendEl.className = `memory-value ${getTrendClass(m.trend)}`;

            const memPercent = m.peak > 0 ? (m.current / m.peak) * 100 : 0;
            document.getElementById('mem-progress').style.width = `${memPercent}%`;
        }

        let pollTimer = null;

        function startPolling() {
            const interval = parseInt(document.getElementById('poll-interval').value);
            if (pollTimer) clearInterval(pollTimer);
            if (interval > 0) {
                pollTimer = setInterval(fetchHealth, interval);
            }
        }

        document.getElementById('poll-interval').addEventListener('change', startPolling);

        fetchHealth();
        startPolling();
    </script>
</body>
</html>
